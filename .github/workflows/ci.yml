name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - name: Type check
        run: pnpm wxt prepare && npx tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Check formatting
        run: pnpm format:check

      - name: Build extension
        run: pnpm build
